name: Jules PR Q&A

# Ask Jules a question during PR review by commenting "@jules <question>",
# either in the PR conversation or as an inline review comment on a line in
# the Files changed tab. Jules analyzes the PR in its VM and replies as a PR
# comment (threaded, for inline questions). It never creates a PR: the
# session is created WITHOUT automationMode, which is the field that
# controls PR creation (the stock jules-action hardcodes AUTO_CREATE_PR,
# which is why this calls the API directly instead).
#
# Note: issue_comment is GitHub's event for PR *conversation* comments; the
# job condition below filters out comments on actual issues.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  jules:
    # Only PR comments that mention @jules, from maintainers.
    if: |
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
      contains(github.event.comment.body, '@jules') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      EVENT_NAME: ${{ github.event_name }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Acknowledge the comment
        run: |
          if [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            ENDPOINT="repos/${GH_REPO}/pulls/comments/${COMMENT_ID}/reactions"
          else
            ENDPOINT="repos/${GH_REPO}/issues/comments/${COMMENT_ID}/reactions"
          fi
          gh api "$ENDPOINT" -f content='eyes' >/dev/null

      - name: Gather PR context
        id: pr
        run: |
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" > pr.json
          {
            echo "title=$(jq -r '.title' pr.json)"
            echo "base_ref=$(jq -r '.base.ref' pr.json)"
            echo "head_ref=$(jq -r '.head.ref' pr.json)"
            echo "head_repo=$(jq -r '.head.repo.full_name' pr.json)"
          } >> "$GITHUB_OUTPUT"
          # The diff is embedded in the prompt so Jules sees the PR's actual
          # changes even when the head branch lives on a fork (where a
          # branch checkout of this repo could not reach it). Truncated to
          # keep the prompt within reasonable size.
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" \
            -H "Accept: application/vnd.github.diff" > pr.diff
          head -c 60000 pr.diff > pr_truncated.diff
          if [ "$(stat -c%s pr.diff)" -gt 60000 ]; then
            echo "" >> pr_truncated.diff
            echo "[diff truncated at 60000 bytes]" >> pr_truncated.diff
          fi

      - name: Create Jules session (no automationMode => no PR)
        id: session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_PATH: ${{ github.event.comment.path }}
          COMMENT_HUNK: ${{ github.event.comment.diff_hunk }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
        run: |
          QUESTION="${COMMENT_BODY//@jules/}"

          # Inline review comments carry the file and diff hunk they were
          # made on; give Jules that context so "this line" means something.
          INLINE_CONTEXT=""
          if [ -n "$COMMENT_PATH" ]; then
            INLINE_CONTEXT="The question was asked as an inline review comment on ${COMMENT_PATH}, on this part of the diff:
          ${COMMENT_HUNK}
          "
          fi

          # A same-repo branch can be checked out directly; a fork PR falls
          # back to the base branch plus the embedded diff.
          if [ "$HEAD_REPO" = "$GH_REPO" ]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="$BASE_REF"
          fi

          PROMPT="You are answering a reviewer's question about pull request #${PR_NUMBER} (\"${PR_TITLE}\") in ${GH_REPO}.

          IMPORTANT: This is an analysis-only task. Do NOT modify any code, do NOT commit, and do NOT create a pull request. Investigate the repository as needed and reply with your answer as a chat message.

          ${INLINE_CONTEXT}Reviewer's question:
          ${QUESTION}

          The pull request's diff (against ${BASE_REF}):
          $(cat pr_truncated.diff)"

          jq -n \
            --arg prompt "$PROMPT" \
            --arg source "sources/github/${GH_REPO}" \
            --arg branch "$BRANCH" \
            --arg title "PR #${PR_NUMBER} review question" \
            '{
              prompt: $prompt,
              sourceContext: {
                source: $source,
                githubRepoContext: {startingBranch: $branch}
              },
              title: $title
            }' > payload.json

          curl -sS -f -X POST "https://jules.googleapis.com/v1alpha/sessions" \
            -H "X-Goog-Api-Key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json > session.json

          echo "name=$(jq -r '.name' session.json)" >> "$GITHUB_OUTPUT"

      - name: Wait for Jules to finish
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_NAME: ${{ steps.session.outputs.name }}
        run: |
          for i in $(seq 1 70); do
            sleep 30
            STATE=$(curl -sS -f "https://jules.googleapis.com/v1alpha/${SESSION_NAME}" \
              -H "X-Goog-Api-Key: ${JULES_API_KEY}" | jq -r '.state')
            echo "Poll ${i}: ${STATE}"
            case "$STATE" in
              COMPLETED|FAILED|PAUSED)
                exit 0 ;;
            esac
          done
          echo "Timed out waiting for the Jules session to finish."
          exit 1

      - name: Post Jules' answer on the PR
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_NAME: ${{ steps.session.outputs.name }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          curl -sS -f "https://jules.googleapis.com/v1alpha/${SESSION_NAME}/activities?pageSize=100" \
            -H "X-Goog-Api-Key: ${JULES_API_KEY}" > activities.json

          jq -r '[.activities[]?
                   | select(.agentMessaged != null)]
                 | sort_by(.createTime)
                 | map(.agentMessaged.message // .agentMessaged.agentMessage // .description)
                 | join("\n\n---\n\n")' activities.json > answer.md

          if [ ! -s answer.md ] || [ "$(cat answer.md)" = "null" ]; then
            echo "Jules finished without posting a message (session: ${SESSION_NAME})." > answer.md
          fi

          {
            echo "## Jules"
            echo ""
            cat answer.md
            echo ""
            echo "---"
            echo "*Asked by @${COMMENT_AUTHOR} · session \`${SESSION_NAME}\`*"
          } > comment.md

          # Inline questions get a threaded reply on the same line; the
          # conversation-tab ones get a regular PR comment.
          if [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/comments/${COMMENT_ID}/replies" \
              -F body=@comment.md >/dev/null
          else
            gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              -F body=@comment.md >/dev/null
          fi

      - name: Report failure on the PR
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            -f body="Jules could not answer this question — the workflow failed or timed out. See the [run log](${RUN_URL})." >/dev/null
