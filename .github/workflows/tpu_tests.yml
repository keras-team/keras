name: Keras TPU Tests

on:
  push:
    branches: [master]
  pull_request:
    types: [labeled, synchronize]
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  # One group per PR for the run-gpu-tpu-tests label and for pushes, so a push
  # cancels a stale in-progress run. Any other label gets its own group and
  # can never cancel a live run. On push/release head_ref is empty, so the
  # key falls back to run_id and master runs are never cancelled.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.event.action == 'labeled' && github.event.label.name || 'run-gpu-tpu-tests' }}
  cancel-in-progress: true

jobs:

  cancel_stale:
    # A push to a PR claims this PR's concurrency group, which cancels a run
    # still going for the previous commit. It deliberately does not re-run
    # the tests: add the run-gpu-tpu-tests label again to test the new commit.
    # A real job is needed here; a run whose jobs are all skipped is not
    # guaranteed to cancel anything.
    name: Cancel stale run
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "Superseded by ${HEAD_SHA}"

  test-in-container:
    # Only run on pushes to master, releases or when "run-gpu-tpu-tests" is added
    if: |
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-gpu-tpu-tests')

    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: jax
            multi_device: false
            runner: linux-x86-ct6e-44-1tpu
            name: Run tests on TPU
          - backend: jax
            multi_device: true
            runner: linux-x86-ct5lp-112-4tpu
            name: Run tests on multi-TPU

    container:
      image: python:3.11-slim

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    env:
      KERAS_HOME: .github/workflows/config/${{ matrix.backend }}

    steps:
      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install binary dependencies
        # curl, git, gpg are for codecov/codecov-action
        run: |
          apt-get update
          apt-get -y install curl
          apt-get -y install git
          apt-get -y install gnupg

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements-${{ matrix.backend }}-tpu.txt

      - name: Verify JAX Installation
        run: python3 -c "import jax; print('JAX devices:', jax.devices(), jax.devices()[0].device_kind); assert jax.default_backend() == 'tpu'"

      - name: Run Tests
        if: ${{ !matrix.multi_device }}
        run: pytest keras --ignore keras/src/applications --cov=keras --cov-config=pyproject.toml

      - name: Run Multi-device Tests
        if: ${{ matrix.multi_device }}
        run: pytest keras -m multi_device --cov=keras --cov-config=pyproject.toml --cov-append

      - name: Convert Coverage
        run: coverage xml --omit='keras/src/applications/*,keras/api' -o core-coverage.xml

      - name: Upload Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          env_vars: KERAS_HOME
          flags: keras,keras-tpu,keras-${{ matrix.backend }}${{ matrix.multi_device == 'true' && '-multi' || '' }}
          files: core-coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
