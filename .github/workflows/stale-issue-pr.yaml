name: Close inactive issues
on:
  schedule:
    - cron: "30 1 * * *"
permissions: {}
jobs:
  close-issues:
    # Don't do this in forks
    if: github.repository == 'keras-team/keras'
    permissions:
      actions: write # actions/stale persists its state in the Actions cache.
      issues: write
      pull-requests: write
    uses: keras-team/shared-workflows/.github/workflows/stale-issue-pr.yml@39975a3069a8b94529025e34a875cbf3a3fb7ab4
