
name: CPU Tests

on:
  workflow_call:
    inputs:
      timeout:
        description: "Per-job timeout in minutes"
        type: number
        default: 120
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  run_cpu_tests:
    strategy:
      fail-fast: false
      matrix:
        backend: [tensorflow, jax, torch, numpy]
        nnx_enabled: [false]
        include:
          - backend: jax
            nnx_enabled: true

    container:
      image: python:3.11-slim

    name: ${{ format('Run tests on CPU ({0}{1})', matrix.backend, matrix.nnx_enabled && ', NNX' || '') }}
    runs-on: linux-x86-n2-16
    timeout-minutes: ${{ inputs.timeout }}

    env:
      KERAS_HOME: .github/workflows/config/${{ matrix.backend }}

    steps:
      - name: Install binary dependencies
        # build-essential is the C++ compiler for Torch Dynamo
        # curl, git, gpg are for codecov/codecov-action
        run: |
          apt-get update
          apt-get -y install build-essential
          apt-get -y install curl
          apt-get -y install git
          apt-get -y install gnupg
          git config --global --add safe.directory '*'

      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for changes in keras/src/applications
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            applications:
              - 'keras/src/applications/**'
            wrappers:
              - 'keras/src/wrappers/**'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps tf_keras
          pip uninstall -y keras

      - name: Run Tests for applications
        if: ${{ steps.filter.outputs.applications == 'true' && matrix.nnx_enabled == false }}
        run: |
          pytest keras/src/applications --cov=keras/src/applications --cov-config=pyproject.toml
          coverage xml --include='keras/src/applications/*' -o apps-coverage.xml

      - name: Upload Coverage for applications
        if: ${{ steps.filter.outputs.applications == 'true' && matrix.nnx_enabled == false }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          env_vars: PYTHON,KERAS_HOME
          flags: keras.applications,keras.applications-${{ matrix.backend }}
          files: apps-coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run Tests for wrappers
        if: ${{ steps.filter.outputs.wrappers == 'true' && matrix.nnx_enabled == false }}
        run: |
          pytest keras/src/wrappers --cov=keras/src/wrappers --cov-config=pyproject.toml
          coverage xml --include='keras/src/wrappers/*' -o wrappers-coverage.xml

      - name: Upload Coverage for wrappers
        if: ${{ steps.filter.outputs.wrappers == 'true' && matrix.nnx_enabled == false }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          env_vars: PYTHON,KERAS_HOME
          flags: keras.wrappers,keras.wrappers-${{ matrix.backend }}
          files: wrappers-coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test integrations
        if: ${{ matrix.backend != 'numpy' && matrix.nnx_enabled == false }}
        run: |
          PYTHONPATH=. python integration_tests/import_test.py
          PYTHONPATH=. python integration_tests/numerical_test.py

      - name: Test JAX-specific integrations
        if: ${{ matrix.backend == 'jax' && matrix.nnx_enabled == false }}
        run: |
          PYTHONPATH=. python integration_tests/jax_custom_fit_test.py

      - name: Test basic flow with NNX
        if: ${{ matrix.nnx_enabled == true }}
        env:
          KERAS_NNX_ENABLED: true
        run: |
          PYTHONPATH=. python integration_tests/import_test.py
          pytest integration_tests/basic_full_flow.py

      - name: Test TF-specific integrations
        if: ${{ matrix.backend == 'tensorflow'}}
        run: |
          PYTHONPATH=. python integration_tests/tf_distribute_training_test.py
          PYTHONPATH=. python integration_tests/tf_custom_fit_test.py

      - name: Test Torch-specific integrations
        if: ${{ matrix.backend == 'torch'}}
        run: |
          pytest integration_tests/torch_workflow_test.py
          PYTHONPATH=. python integration_tests/torch_custom_fit_test.py

      - name: Run Tests
        if: ${{ matrix.nnx_enabled == false }}
        run: pytest keras --pytest-durations=100 --pytest-durations-group-by=class --ignore keras/src/applications --ignore keras/src/wrappers --cov=keras --cov-config=pyproject.toml

      - name: Run Tests Incompatible with pytest-xdist
        if: ${{ matrix.nnx_enabled == false }}
        run: pytest keras -m no_pytest_xdist -v --cov=keras --cov-config=pyproject.toml --cov-append

      - name: Run Multi-Device Tests
        if: ${{ matrix.backend == 'jax' }}
        run: JAX_NUM_CPU_DEVICES=4 pytest keras -m multi_device --cov=keras --cov-config=pyproject.toml --cov-append

      - name: Run Multi-Process Tests with torchrun
        if: ${{ matrix.backend == 'torch' }}
        # On CPU, torch counts one device per process, so the `multi_device`
        # tests run only under torchrun. torchrun fails when a rank fails, and
        # `--tee=3` puts the rank in front of each output line. `-x` stops a
        # failing rank at once, so the other rank does not wait for it in a
        # collective. The timeout stops all other hangs. Each rank writes its
        # own coverage file, because two pytest-cov sessions that combine into
        # one `.coverage` at the same time can corrupt it.
        timeout-minutes: 10
        run: |
          torchrun --nproc_per_node=2 --master_addr=127.0.0.1 --master_port=29500 --tee=3 \
            -m coverage run --parallel-mode --source=keras --rcfile=pyproject.toml \
            -m pytest keras/src/backend/torch/torch_multi_process_distribution_test.py -m multi_device -x
          coverage combine --append

      - name: Convert Coverage
        if: ${{ matrix.nnx_enabled == false }}
        run: coverage xml --omit='keras/src/applications/*,keras/src/wrappers/*,keras/api' -o core-coverage.xml

      - name: Upload Coverage
        if: ${{ matrix.nnx_enabled == false }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          env_vars: PYTHON,KERAS_HOME,KERAS_NNX_ENABLED
          flags: keras,keras-cpu,keras-${{ matrix.backend }}${{ matrix.nnx_enabled == 'true' && '-nnx' || '' }}
          files: core-coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
